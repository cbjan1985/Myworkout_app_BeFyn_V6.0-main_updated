name: Build FiT85 APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: bash   # GitHub runs this as 'bash -eo pipefail', so a failing command inside a pipe (| tee) fails the step

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Read the app version
        id: ver
        run: echo "name=$(node -p "require('./package.json').fit85.versionName")" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Dependency audit (npm advisory database, production dependencies)
        run: |
          npm audit --omit=dev --json > npm-audit.json || true
          node tools/audit-gate.mjs npm-audit.json | tee npm-audit.log

      - name: Signing identity (must be the V5.0 key so FiT85 installs over V5.0)
        env:
          KEYSTORE_B64: ${{ secrets.BEFYN_V5_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > signing/debug.keystore
            echo "Using the V5.0 keystore from the repository secret BEFYN_V5_KEYSTORE_BASE64"
          else
            echo "::warning::Using signing/debug.keystore from the repository. Store it as the secret BEFYN_V5_KEYSTORE_BASE64 and delete the file from the repository."
          fi
          keytool -list -v -keystore signing/debug.keystore -storepass android -alias androiddebugkey | grep -E "SHA256" | tee keystore-fingerprint.txt
          GOT=$(sed 's/.*SHA256: *//' keystore-fingerprint.txt | tr -d ': \n' | tr 'A-F' 'a-f'); WANT=$(tr -d ': \n' < signing/V5_CERT_SHA256.txt | tr 'A-F' 'a-f')
          test "$GOT" = "$WANT" || { echo "::error::The keystore is not the V5.0 signing identity. FiT85 would not install over V5.0."; exit 1; }

      - name: Check the app (logic tests, contrast, syntax, imports, security scan)
        run: |
          npm test
          node tools/check.mjs
          node tools/security-scan.mjs

      - name: Add the spreadsheet library to the web app
        run: |
          test -f node_modules/xlsx/dist/xlsx.full.min.js
          cp node_modules/xlsx/dist/xlsx.full.min.js www/xlsx.full.min.js

      - name: Build the APK (with Health Connect)
        id: full
        continue-on-error: true
        env:
          BUILD_LOG: build-full.log
        run: tools/android-build.sh

      - name: Why the first build failed
        if: steps.full.outcome == 'failure'
        run: |
          echo "::warning::The build with Health Connect FAILED. Building without Health Connect instead. Key lines from the Gradle log:"
          grep -nE "FAILURE:|What went wrong|error:|^e: |Execution failed|Could not " build-full.log | head -40 || true
          { echo "### The Health Connect build failed"; echo '```'; grep -nE "FAILURE:|What went wrong|error:|^e: |Execution failed|Could not " build-full.log | head -25 || true; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: Build the APK (fallback without Health Connect)
        id: fallback
        if: steps.full.outcome == 'failure'
        env:
          BUILD_LOG: build-fallback.log
        run: tools/android-build.sh --no-health

      - name: Verify the APK exists and is correct
        run: |
          if [ "${{ steps.full.outcome }}" = "success" ]; then tools/verify-apk.sh; else tools/verify-apk.sh --suffix _no-health; fi

      - name: Upload the APK
        uses: actions/upload-artifact@v4
        with:
          name: FiT85_V${{ steps.ver.outputs.name }}-APK
          path: dist/*.apk
          if-no-files-found: error

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: FiT85_V${{ steps.ver.outputs.name }}-build-logs
          path: |
            build-*.log
            npm-audit.log
            npm-audit.json
            keystore-fingerprint.txt
          if-no-files-found: ignore
          retention-days: 14
